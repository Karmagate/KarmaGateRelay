name: Telegram Notify
description: Send GitHub Actions workflow result to Telegram

inputs:
  token:
    description: Telegram bot token
    required: true
  chat_id:
    description: Telegram chat ID
    required: true
  status:
    description: Workflow result (success, failure, cancelled)
    required: true
  workflow:
    description: Workflow name
    required: true
  repo:
    description: Repository name
    required: true
  run_url:
    description: Actions run URL
    required: true
  ref:
    description: Branch or tag
    required: true
  actor:
    description: Who triggered the run
    required: true
  extra:
    description: Optional extra context line
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        CHAT_ID: ${{ inputs.chat_id }}
        STATUS: ${{ inputs.status }}
        WORKFLOW: ${{ inputs.workflow }}
        REPO: ${{ inputs.repo }}
        RUN_URL: ${{ inputs.run_url }}
        REF: ${{ inputs.ref }}
        ACTOR: ${{ inputs.actor }}
        EXTRA: ${{ inputs.extra }}
      run: |
        if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set, skipping notification"
          exit 0
        fi

        case "$STATUS" in
          success) ICON="✅" ;;
          failure) ICON="❌" ;;
          cancelled) ICON="⚠️" ;;
          *) ICON="ℹ️" ;;
        esac

        TEXT="${ICON} <b>${WORKFLOW}</b>
        Repo: <code>${REPO}</code>
        Branch: <code>${REF}</code>
        Actor: ${ACTOR}
        Status: <b>${STATUS}</b>"

        if [ -n "$EXTRA" ]; then
          TEXT="${TEXT}
        ${EXTRA}"
        fi

        TEXT="${TEXT}

        <a href=\"${RUN_URL}\">Open run</a>"

        curl -sf -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d "chat_id=${CHAT_ID}" \
          -d "parse_mode=HTML" \
          --data-urlencode "text=${TEXT}" \
          -d "disable_web_page_preview=true"
